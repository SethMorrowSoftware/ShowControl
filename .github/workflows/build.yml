name: build

# Builds the ShowControl native shims (osc, midi) and runs every gate for each
# supported target, then attaches the binaries to a published GitHub Release.
# The Art-Net extension is pure LCB -- it has no native build; its wire format is
# gated by the Python golden-packet test in the `static` job below.
#
# Targets (osc has no external deps; midi links the platform MIDI backend):
#   linux-x86_64    64-bit, manylinux2014 container -> glibc 2.17 floor
#   linux-i686      32-bit, manylinux2014 container (OSC only; see note)
#   macos-universal arm64 + x86_64 in one dylib
#   windows-x64 / windows-x86   MSVC
#
# Triggers: pushes to main and PRs build + test (no attach); a published Release
# builds + attaches; a manual run with release_tag attaches after the fact.

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach built binaries to this existing release tag. Blank = build & test only."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.release_tag }}
  cancel-in-progress: true

jobs:
  # Cheap gate: static checks on the script layer (OXT cannot compile LCB in CI),
  # the Art-Net golden-packet spec, and an ASan/UBSan run of the C smoke tests
  # (this is the build that first caught a real null-deref in the MIDI shim).
  static:
    name: lint + golden + asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static .lcb / .livecodescript gates
        run: python3 tools/check-livecodescript.py
      - name: Art-Net golden-packet spec
        run: python3 tests/artnet_golden_test.py
      - name: ALSA headers (for the MIDI shim)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build + run the C smoke tests under AddressSanitizer + UBSan
        # UBSan is RECOVERABLE by default: it prints a diagnostic and the process
        # exits 0, so real undefined behaviour (e.g. a misaligned load parsing an
        # OSC datagram) sails through a green CI. -fno-sanitize-recover=all makes
        # every sanitizer ABORT on the first error, and the *_OPTIONS reinforce it,
        # so this gate actually gates -- which is the whole point of running it.
        #
        # NOTE: float-cast-overflow is NOT in the default -fsanitize=undefined group
        # (it was split out), yet an out-of-range float->int coercion IS undefined
        # behaviour and IS reachable from a hostile OSC float argument. Add it
        # explicitly so that class is gated too.
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DSHOWCONTROL_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure

  # Linux x86_64 on a modern toolchain. (Maximally-portable glibc-2.17 binaries
  # via a manylinux container, and 32-bit Linux, are follow-ups -- RtMidi's C++
  # needs a newer compiler than the manylinux2014 default; tracked in CHANGELOG.)
  build-linux:
    name: build & test (linux-x86_64)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ALSA headers (for the MIDI shim)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Configure / build / test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHOWCONTROL_BUILD_TESTS=ON
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure
      - name: Stage libraries
        run: |
          mkdir -p dist
          cp "$(find build -maxdepth 2 -name osc.so  | head -n1)" dist/osc-linux-x86_64.so
          cp "$(find build -maxdepth 2 -name midi.so | head -n1)" dist/midi-linux-x86_64.so
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  # macOS + Windows build natively.
  build-native:
    name: build & test (${{ matrix.name }})
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
            ext: dylib
          - name: windows-x64
            os: windows-latest
            cmake_args: -A x64
            ext: dll
          - name: windows-x86
            os: windows-latest
            cmake_args: -A Win32
            ext: dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHOWCONTROL_BUILD_TESTS=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Stage libraries
        shell: bash
        run: |
          mkdir -p dist
          for lib in osc midi; do
            src="$(find build -maxdepth 2 -name "${lib}.${{ matrix.ext }}" | head -n1)"
            test -n "$src" || { echo "missing ${lib}.${{ matrix.ext }}"; exit 1; }
            cp "$src" "dist/${lib}-${{ matrix.name }}.${{ matrix.ext }}"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach binaries to the release
    needs: [ build-linux, build-native ]
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          echo "Attaching binaries to release: $TAG"
          gh release upload "$TAG" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

  # When the osc/midi shim SOURCES change on main (or on a manual run), take the
  # per-platform binaries this workflow just built and drop them into the committed
  # src/<ext>/code/<platform-id>/ trees, then open/update ONE PR with the result.
  # This automates what tools/package-extension.py does by hand.
  #
  # Why a PR (not a direct push to main): the compiled libraries are NOT
  # byte-reproducible (build-ids / timestamps differ run to run), and main may be
  # branch-protected. A PR keeps main's history clean, is reviewable, and works
  # regardless of protection. The job is gated to ACTUAL shim-source changes so it
  # never churns on doc-only pushes, and code/ is excluded from the trigger diff so
  # merging the refresh PR can't re-trigger it (no loop).
  #
  # One-time repo setting this needs: Settings -> Actions -> General ->
  # "Allow GitHub Actions to create and approve pull requests". (A PR opened by the
  # built-in GITHUB_TOKEN does not itself trigger CI -- which is fine here: the
  # binaries were already built and tested by the jobs above, and it avoids a loop.)
  package-binaries:
    name: refresh committed code/ trees (open a PR)
    needs: [ build-linux, build-native ]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history to diff the push range
      - name: Decide whether a refresh is warranted
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run -> refresh"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Refresh only when the shim SOURCES changed -- not on doc-only pushes, and
          # not on a code/ binary commit (excluded), so the refresh PR can't loop.
          if git diff --name-only "$base" "${{ github.sha }}" -- \
               src/osc src/midi src/third_party CMakeLists.txt ':(exclude)src/**/code/**' \
               | grep -q .; then
            echo "shim sources changed -> refresh"; echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "no shim source change -> skip"; echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the built per-platform binaries
        if: steps.gate.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Place binaries into src/<ext>/code/<platform-id>/
        if: steps.gate.outputs.go == 'true'
        run: |
          # Map the staged artifact names onto the committed slots. 32-bit Linux
          # (x86-linux) is not built by CI yet, so that slot is left untouched.
          python3 tools/package-extension.py \
            --osc-linux64 dl/osc-linux-x86_64.so       --midi-linux64 dl/midi-linux-x86_64.so \
            --osc-mac     dl/osc-macos-universal.dylib  --midi-mac    dl/midi-macos-universal.dylib \
            --osc-win64   dl/osc-windows-x64.dll        --midi-win64  dl/midi-windows-x64.dll \
            --osc-win32   dl/osc-windows-x86.dll        --midi-win32  dl/midi-windows-x86.dll
          python3 tools/package-extension.py --check || true   # informational (x86-linux stays empty)
      - name: Open or update the refresh PR
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="ci/refresh-native-binaries"
          git checkout -B "$branch"                 # branch from current main, keep the placed files
          git add src/osc/code src/midi/code
          if git diff --cached --quiet; then
            echo "Built binaries are identical to the committed ones; nothing to do."
            exit 0
          fi
          git commit -m "CI: refresh committed native binaries from ${GITHUB_SHA::7} [skip ci]"
          git push -f origin "$branch"
          open_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')
          if [ "$open_count" -gt 0 ]; then
            echo "Existing open PR was updated by the force-push."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "CI: refresh committed native binaries" \
              --body "Automated refresh of \`src/<ext>/code/<platform-id>/\` from the latest build of \`osc_shim.c\` / \`midi_shim.c\` (source commit ${GITHUB_SHA::7}), built and tested by the \`build\` workflow. Merge to update the committed, ready-to-package binaries. 32-bit Linux (\`x86-linux\`) is not built by CI yet, so that slot is unchanged."
          fi
