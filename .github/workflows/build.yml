name: build

# Fast per-push feedback for the native shims (osc, midi): the static gates, an
# ASan/UBSan run of the C tests, and a build + test on Linux, macOS (universal)
# and Windows (x64 + x86). Its builds are NOT what ships -- stock runners give
# glibc 2.39 / dynamic runtimes. The committed, portable, verified libraries come
# from release-binaries.yml; a published Release attaches THOSE (see `release`).
# The Art-Net extension is pure LCB -- it has no native build.
#
# Triggers: pushes to main and PRs build + test; a published Release attaches the
# committed binaries; a manual run with release_tag attaches after the fact.

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach built binaries to this existing release tag. Blank = build & test only."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.release_tag }}
  cancel-in-progress: true

jobs:
  # Cheap gate: static checks on the script layer (OXT cannot compile LCB in CI),
  # the Art-Net golden-packet spec, and an ASan/UBSan run of the C smoke tests
  # (this is the build that first caught a real null-deref in the MIDI shim).
  static:
    name: lint + golden + asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static .lcb / .livecodescript gates (+ their fixtures)
        run: |
          python3 tests/checker_fixtures_test.py
          python3 tools/check-livecodescript.py
      - name: Art-Net golden-packet spec
        run: python3 tests/artnet_golden_test.py
      - name: ALSA headers (for the MIDI shim)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build + run the C smoke tests under AddressSanitizer + UBSan
        # UBSan is RECOVERABLE by default: it prints a diagnostic and the process
        # exits 0, so real undefined behaviour (e.g. a misaligned load parsing an
        # OSC datagram) sails through a green CI. -fno-sanitize-recover=all makes
        # every sanitizer ABORT on the first error, and the *_OPTIONS reinforce it,
        # so this gate actually gates -- which is the whole point of running it.
        #
        # NOTE: float-cast-overflow is NOT in the default -fsanitize=undefined group
        # (it was split out), yet an out-of-range float->int coercion IS undefined
        # behaviour and IS reachable from a hostile OSC float argument. Add it
        # explicitly so that class is gated too.
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
        run: |
          # STATIC_RUNTIME=OFF: a private static libstdc++ inside midi.so would sit
          # between our code and ASan's allocator interception; this job is about
          # OUR memory safety -- the shipped lanes (release-binaries.yml) keep it ON.
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DSHOWCONTROL_BUILD_TESTS=ON -DSHOWCONTROL_STATIC_RUNTIME=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure --no-tests=error

  # Linux x86_64 on a modern toolchain. (Maximally-portable glibc-2.17 binaries
  # via a manylinux container, and 32-bit Linux, are follow-ups -- RtMidi's C++
  # needs a newer compiler than the manylinux2014 default; tracked in CHANGELOG.)
  build-linux:
    name: build & test (linux-x86_64)
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ALSA headers (for the MIDI shim)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Configure / build / test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHOWCONTROL_BUILD_TESTS=ON
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure --no-tests=error
      - name: Stage libraries
        run: |
          mkdir -p dist
          # -not -path '*/mock/*': the test build also emits the MOCK midi library
          # (tests/mock/rtmidi_mock.c) as build/mock/midi.so -- never ship that.
          cp "$(find build -maxdepth 2 -name osc.so  -not -path '*/mock/*' | head -n1)" dist/osc-linux-x86_64.so
          cp "$(find build -maxdepth 2 -name midi.so -not -path '*/mock/*' | head -n1)" dist/midi-linux-x86_64.so
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  # macOS + Windows build natively.
  build-native:
    name: build & test (${{ matrix.name }})
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
            ext: dylib
          - name: windows-x64
            os: windows-latest
            cmake_args: -A x64
            ext: dll
          - name: windows-x86
            os: windows-latest
            cmake_args: -A Win32
            ext: dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHOWCONTROL_BUILD_TESTS=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
      - name: Stage libraries
        shell: bash
        run: |
          mkdir -p dist
          for lib in osc midi; do
            # never the MOCK midi library the test build puts in build/mock/
            src="$(find build -maxdepth 2 -name "${lib}.${{ matrix.ext }}" -not -path '*/mock/*' | head -n1)"
            test -n "$src" || { echo "missing ${lib}.${{ matrix.ext }}"; exit 1; }
            cp "$src" "dist/${lib}-${{ matrix.name }}.${{ matrix.ext }}"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Release assets are the COMMITTED, verified libraries -- the same files an
  # installed extension carries -- not this workflow's stock-runner builds (which
  # exist for fast per-push feedback and are not portable: glibc 2.39, dynamic
  # runtimes). The committed tree is produced by release-binaries.yml and must
  # pass the freshness gate before anything is attached.
  release:
    name: attach the committed binaries to the release
    needs: [ build-linux, build-native ]
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The committed binaries must be fresh
        run: python3 tools/check-binary-freshness.py
      - name: Stage <ext>-<platform-id>.<suffix> + the manifests
        run: |
          mkdir -p dist
          for f in src/osc/code/*/osc.* src/midi/code/*/midi.*; do
            pid=$(basename "$(dirname "$f")"); base=$(basename "$f"); ext=${base%%.*}
            cp "$f" "dist/${ext}-${pid}.${base#*.}"
          done
          cp src/osc/code/MANIFEST.sha256 dist/osc-MANIFEST.sha256
          cp src/midi/code/MANIFEST.sha256 dist/midi-MANIFEST.sha256
          ls -l dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

  # (The former `package-binaries` job -- which opened an automatic PR with this
  # workflow's stock builds after every shim push to main -- is replaced by
  # .github/workflows/release-binaries.yml: portable lanes for all six platform
  # ids, verification before anything lands, and a commit only when a person
  # dispatches it. The xtalk-suite's rule: automatic workflows never commit.)
